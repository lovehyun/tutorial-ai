<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Iris 예측기</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; margin: 40px; }
        .wrapper { display: flex; flex-direction: row; gap: 30px; justify-content: center; }
        .form-box, .graph-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 5px #ccc; }
        .form-box { width: 350px; }
        input, select, button { width: 90%; padding: 8px; margin: 8px 0; font-size: 1em; }
        .result { margin-top: 15px; text-align: center; font-weight: bold; color: #0074D9; }
        .graph-box img { max-width: 800px; display: block; margin-bottom: 20px; }
        .placeholder { color: #aaa; text-align: center; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="form-box">
            <h2>🌸 Iris 꽃 예측기</h2>
            <form method="POST">
                {% for name, label in feature_fields %}
                    <label>{{ label }}</label>
                    <input type="number" step="any" name="{{ name }}" required>
                {% endfor %}
                <label>모델 선택</label>
                <select name="model">
                    {% for model in model_names %}
                        <option value="{{ model }}" {% if model == model_name %}selected{% endif %}>{{ model }}</option>
                    {% endfor %}
                </select>
                <button type="submit">예측하기</button>
            </form>
            {% if prediction %}
                <div class="result">예측 결과: {{ prediction }}</div>
            {% endif %}
        </div>
        <div class="graph-box">
            {% if img_base64 %}
                <img src="data:image/png;base64,{{ img_base64 }}" alt="확률 그래프">
            {% endif %}
            {% if pca_base64 %}
                <img src="data:image/png;base64,{{ pca_base64 }}" alt="PCA 그래프">
            {% else %}
                <div class="placeholder">예측 후 그래프가 여기에 표시됩니다</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
