<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Iris 품종 예측</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 10px; box-shadow: 2px 2px 10px #ccc; }
        h2 { text-align: center; }
        input, button { width: 90%; padding: 10px; margin: 10px 0; }
        .result { text-align: center; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Iris 품종 예측기</h2>
        <form action="/predict" method="post">
            <input type="number" step="any" name="sepal_length" placeholder="Sepal Length (cm)" required>
            <input type="number" step="any" name="sepal_width" placeholder="Sepal Width (cm)" required>
            <input type="number" step="any" name="petal_length" placeholder="Petal Length (cm)" required>
            <input type="number" step="any" name="petal_width" placeholder="Petal Width (cm)" required>
            <button type="submit">예측하기</button>
        </form>
        {% if prediction_text %}
            <div class="result">{{ prediction_text }}</div>
        {% endif %}
    </div>
</body>
</html>
