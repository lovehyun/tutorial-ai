<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스팸 메시지 분류기</title>
</head>
<body>
    <h1>스팸 메시지 판별기</h1>
    <form method="POST">
        <input type="text" name="message" placeholder="메시지를 입력하세요" size="50" required>
        <button type="submit">판별하기</button>
    </form>

    {% if result %}
        <h2>결과: {{ result }}</h2>
    {% endif %}
</body>
</html>
